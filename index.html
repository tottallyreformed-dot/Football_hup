<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AppZone</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
color:white;
background:
radial-gradient(circle at top,#17613f 0%,#0b2116 42%,#030906 100%);
min-height:100vh
}

header{
text-align:center;
padding:35px 15px 30px;
background:linear-gradient(135deg,#0b6338,#07130d);
border-bottom:1px solid #28734e;
box-shadow:0 5px 25px #0006
}

.profile{
width:80px;
height:80px;
border-radius:50%;
object-fit:cover;
margin:0 auto 10px;
display:block;
border:3px solid #8ff0ba;
box-shadow:0 0 20px #19a46388
}

header b{
color:#8ff0ba;
font-size:17px
}

header h1{
margin:8px 0;
font-size:38px
}

.sub{
color:#c8e8d7;
font-size:16px
}

main{
max-width:950px;
margin:25px auto;
padding:0 15px
}

/* البحث */

.search{
position:relative;
margin-bottom:20px
}

.search input{
width:100%;
padding:16px 48px 16px 18px;
border-radius:15px;
border:1px solid #28734e;
background:#0b2015;
color:white;
font-size:16px;
outline:none;
box-shadow:0 5px 20px #0004
}

.search input:focus{
border-color:#19a463;
box-shadow:0 0 15px #19a46355
}

.search span{
position:absolute;
right:17px;
top:14px;
font-size:21px
}

/* القائمة */

.menu{
display:flex;
gap:12px;
margin-bottom:22px
}

.menu button{
flex:1;
padding:15px;
border:1px solid #28734e;
border-radius:14px;
background:#102b1d;
color:white;
font-size:17px;
font-weight:bold;
cursor:pointer;
transition:.2s
}

.menu button:hover{
background:#17452e
}

.menu button.active{
background:linear-gradient(135deg,#19a463,#117747);
border-color:#4bd18f;
box-shadow:0 5px 18px #19a46344
}

/* الشبكة */

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
gap:17px
}

/* الكروت */

.card,.detail{
background:linear-gradient(145deg,#163727,#081910);
border:1px solid #28734e;
border-radius:20px;
padding:20px;
box-shadow:0 10px 30px #0005
}

.card{
cursor:pointer;
transition:.25s;
position:relative;
overflow:hidden
}

.card:before{
content:"";
position:absolute;
top:0;
right:0;
width:100%;
height:3px;
background:linear-gradient(90deg,#19a463,#8ff0ba);
opacity:.7
}

.card:hover{
transform:translateY(-5px);
border-color:#3e9e6c;
box-shadow:0 15px 35px #0008
}

.logo{
width:75px;
height:75px;
border-radius:16px;
object-fit:cover;
background:white;
margin-bottom:10px;
box-shadow:0 5px 15px #0005
}

.card h2{
margin:5px 0 7px;
font-size:21px
}

.small,p,li{
color:#cfe3d7;
line-height:1.7
}

/* النجوم */

.rating{
margin:7px 0 4px;
font-size:19px;
letter-spacing:2px
}

.rating span{
color:#ffd43b;
text-shadow:0 0 7px #ffd43b55
}

.rating small{
color:#9db8aa;
font-size:13px;
letter-spacing:0
}

/* التفاصيل */

.detail{
display:none;
animation:show .3s ease
}

@keyframes show{
from{
opacity:0;
transform:translateY(10px)
}
to{
opacity:1;
transform:translateY(0)
}
}

.back{
color:#9fe0bd;
cursor:pointer;
margin-bottom:15px;
font-weight:bold
}

.btn{
display:block;
text-align:center;
text-decoration:none;
background:linear-gradient(135deg,#19a463,#117747);
color:white;
padding:14px;
border-radius:11px;
margin-top:15px;
font-weight:bold;
transition:.2s
}

.btn:hover{
transform:scale(1.02);
filter:brightness(1.1)
}

.apple{
background:#111;
border:1px solid #444
}

.noResult{
display:none;
text-align:center;
padding:30px;
color:#b9d6c7;
background:#0b2015;
border:1px solid #28734e;
border-radius:18px
}

/* الهاتف */

@media(max-width:600px){

header h1{
font-size:31px
}

.grid{
grid-template-columns:1fr
